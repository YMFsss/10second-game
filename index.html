<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Second Challenge</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', sans-serif; 
        }
        
        body { 
            /* Configured for your image in C:\Users\admin\Downloads\time_challenge_game */
            /* Note: If it doesn't load, change .jpg to .png or .jpeg depending on your photo */
            background-image: url('tyjtdy.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            /* Fallback color if the image isn't found */
            background-color: #1a1a2e; 
            
            color: #e2e2e2; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
        
        .container { 
            text-align: center; 
            /* Semi-transparent background with a blur so you can see your photo behind it */
            background: rgba(22, 33, 62, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            padding: 2.5rem; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 90%; 
            max-width: 450px; 
        }
        
        h1 { 
            color: #e94560; 
            margin-bottom: 0.5rem; 
        }
        
        p { 
            font-weight: bold; 
            margin-bottom: 2rem; 
            color: #8a9fc4; 
        }
        
        .timer-display { 
            font-size: 4rem; 
            font-family: monospace; 
            margin-bottom: 2rem; 
            color: #00fff5; 
            text-shadow: 0 0 10px rgba(0,255,245,0.3); 
        }
        
        .btn { 
            background: #00fff5; 
            color: #1a1a2e; 
            border: none; 
            padding: 1rem 2.5rem; 
            font-size: 1.5rem; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            width: 100%; 
            transition: all 0.2s; 
        }
        
        .btn.stop { 
            background: #e94560; 
            color: #fff; 
        }
        
        .result-message { 
            margin-top: 1.5rem; 
            font-size: 1.2rem; 
            font-weight: 600; 
            line-height: 1.5;
            min-height: 3.6rem; /* Prevents layout shifting when text appears */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>10.000s Challenge</h1>
        <p>Test your internal clock!</p>
        <div class="timer-display" id="display">0.000</div>
        <button class="btn" id="actionBtn">START</button>
        <div class="result-message" id="result"></div>
    </div>

    <script>
        let isRunning = false;
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;

        const display = document.getElementById('display');
        const actionBtn = document.getElementById('actionBtn');
        const result = document.getElementById('result');

        actionBtn.addEventListener('click', () => {
            if (!isRunning) {
                // STARTING THE GAME
                isRunning = true;
                actionBtn.textContent = 'STOP';
                actionBtn.classList.add('stop');
                result.textContent = '';
                startTime = performance.now();
                timerInterval = setInterval(() => {
                    elapsedTime = performance.now() - startTime;
                    display.textContent = (elapsedTime / 1000).toFixed(3);
                }, 1);
            } else {
                // STOPPING THE GAME
                isRunning = false;
                actionBtn.textContent = 'START';
                actionBtn.classList.remove('stop');
                clearInterval(timerInterval);

                const finalTime = elapsedTime / 1000;
                const diff = Math.abs(finalTime - 10.000);

                // Custom Conversations based on your performance
                let message = "";
                
                if (diff === 0) {
                    message = "🎯 UNBELIEVABLE! 10.000s exact! Are you a robot or did you just pause time itself?";
                } else if (diff <= 0.02) {
                    message = `🤯 Incredible! You got ${finalTime.toFixed(3)}s. That's only ${diff.toFixed(3)}s off! You have god-like reflexes.`;
                } else if (diff <= 0.10) {
                    message = `⚡ So close! You hit ${finalTime.toFixed(3)}s. Just a split second off. You've almost mastered this!`;
                } else if (diff <= 0.50) {
                    message = `👍 Not bad at all! You got ${finalTime.toFixed(3)}s. A solid attempt, but your internal clock needs a tiny tune-up.`;
                } else if (diff <= 1.50) {
                    message = `🥱 Meh. You hit ${finalTime.toFixed(3)}s. Were you distracted by something? You can definitely do better than that.`;
                } else {
                    message = `🚨 Yikes! You landed on ${finalTime.toFixed(3)}s. You're completely lost in time. Try counting out loud next time!`;
                }

                result.textContent = message;
            }
        });
    </script>
</body>
</html>
